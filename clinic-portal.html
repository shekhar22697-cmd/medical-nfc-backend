<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareSync | Reception & Clinical Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --accent: #0d9488;
      --bg: #f0fdf4;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
      --radius: 14px;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; transition: all 0.2s ease; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: radial-gradient(circle at top left, #ccfbf1 0%, #f8fafc 50%, #f1f5f9 100%);
      min-height: 100vh;
      margin: 0;
      padding: 2.5rem 1rem;
      color: var(--text);
    }

    .container { max-width: 720px; margin: 0 auto; }
    
    .desk-header { text-align: center; margin-bottom: 2rem; }
    .desk-badge { display: inline-block; background: #dcfce7; color: #15803d; padding: 0.35rem 0.85rem; border-radius: 50px; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    .desk-title { font-size: 1.6rem; font-weight: 800; color: var(--text); margin: 0; letter-spacing: -0.02em; }
    
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.75rem;
      box-shadow: var(--shadow);
      border: 1px solid rgba(226, 232, 240, 0.8);
      margin-bottom: 1.5rem;
    }

    .scan-btn {
      width: 100%;
      padding: 1.1rem;
      border-radius: 10px;
      border: none;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      background: linear-gradient(135deg, #0284c7, #0d9488);
      color: white;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }
    .scan-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }

    .status-pill {
      margin-top: 0.85rem;
      padding: 0.6rem 1rem;
      background: #f8fafc;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      justify-content: center;
      border: 1px solid var(--border);
    }

    /* Medical Report Display Card */
    .patient-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1rem; }
    .patient-name { font-size: 1.4rem; font-weight: 800; color: #0f172a; margin: 0; }
    .pill { display: inline-block; padding: 0.25rem 0.65rem; border-radius: 6px; font-weight: 700; font-size: 0.75rem; }
    .pill-blood { background: #fee2e2; color: #b91c1c; }
    .pill-insurance { background: #dcfce7; color: #15803d; }
    
    .data-row { display: grid; grid-template-columns: 140px 1fr; margin-bottom: 0.6rem; font-size: 0.9rem; }
    .data-label { font-weight: 700; color: #64748b; }
    .tag-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 600; font-size: 0.8rem; display: inline-block; margin-right: 0.3rem; margin-bottom: 0.2rem; }

    /* Folder display cards */
    .folder-grid-display { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0.85rem; margin-top: 1.25rem; }
    .folder-display-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 0.85rem 1rem; }
    .folder-title { font-weight: 700; font-size: 0.85rem; color: #334155; margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.4rem; }
    .action-btn { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 0.35rem 0.75rem; border-radius: 6px; text-decoration: none; font-size: 0.8rem; font-weight: 700; }
    .action-btn.dl { background: #e2e8f0; color: #334155; margin-left: 0.35rem; }
    .no-file { font-size: 0.8rem; color: #94a3b8; font-style: italic; }

    /* Link section */
    .link-section { background: #fffbeb; border: 1px solid #fde68a; }
    .link-title { font-weight: 800; font-size: 1rem; color: #92400e; margin: 0 0 0.85rem 0; }
  </style>
</head>
<body>

  <div class="container">
    <div class="desk-header">
      <div class="desk-badge">Clinical Access Terminal</div>
      <h1 class="desk-title">Shekhar, Vinayak & Randhir Clinic Desk</h1>
    </div>

    <!-- Scan Card -->
    <div class="card">
      <button id="scan-btn" class="scan-btn">
        <span>📡</span> Tap / Scan Patient NFC Tag
      </button>
      <div id="status" class="status-pill">
        <span>⚪</span> Ready for NFC card check-in
      </div>
    </div>

    <!-- Dynamic Medical Display Card -->
    <div class="card" id="display-box" style="display:none; border-left: 6px solid var(--primary);">
      <div class="patient-header">
        <div>
          <h2 class="patient-name" id="patient-name">Patient Name</h2>
          <span style="font-size: 0.85rem; color: var(--text-muted);" id="patient-dob">DOB: --</span>
        </div>
        <div>
          <span class="pill pill-blood" id="patient-blood">Blood: O+</span>
        </div>
      </div>

      <div class="data-row">
        <span class="data-label">Insurance:</span>
        <span id="insurance" class="pill pill-insurance" style="display:inline-block; width:fit-content;"></span>
      </div>
      <div class="data-row">
        <span class="data-label">Allergies:</span>
        <div id="allergies-box"></div>
      </div>
      <div class="data-row">
        <span class="data-label">Conditions:</span>
        <span id="conditions"></span>
      </div>
      <div class="data-row">
        <span class="data-label">Emergency:</span>
        <span id="emergency" style="font-weight: 600;"></span>
      </div>

      <h4 style="margin: 1.5rem 0 0 0; color: #475569; text-transform: uppercase; font-size: 0.78rem; letter-spacing: 0.05em;">Categorized Medical Documents</h4>
      <div id="folders-container" class="folder-grid-display"></div>
    </div>

    <!-- NFC Tag Registration Map -->
    <div class="card link-section">
      <h3 class="link-title">🔗 Associate NFC Card to Patient</h3>
      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
        <input type="email" id="link-email" placeholder="Patient's Registered Email" style="flex: 2; min-width: 220px; padding: 0.75rem; border: 1.5px solid #cbd5e1; border-radius: 8px;">
        <input type="text" id="link-card-id" placeholder="Card Tag ID (e.g. PATIENT-001)" style="flex: 1; min-width: 140px; padding: 0.75rem; border: 1.5px solid #cbd5e1; border-radius: 8px;">
      </div>
      <button onclick="linkCard()" style="width: 100%; margin-top: 0.75rem; background: #059669; color: white; border: none; padding: 0.75rem; border-radius: 8px; font-weight: 700; cursor: pointer;">
        Confirm Card Link
      </button>
    </div>
  </div>

  <script>
    const API_URL = "https://medical-nfc-backend.onrender.com/api";

    document.getElementById('scan-btn').addEventListener('click', async () => {
      if (!('NDEFReader' in window)) {
        const testId = prompt("Web NFC not available on this browser. Enter Card ID to simulate:", "PATIENT-001");
        if (testId) fetchCardData(testId);
        return;
      }

      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        document.getElementById('status').innerHTML = "<span>🟢</span> Scanning active... Touch card to back of phone.";

        ndef.addEventListener("reading", ({ message, serialNumber }) => {
          let cardId = "";
          for (const record of message.records) {
            const textDecoder = new TextDecoder(record.encoding);
            cardId = textDecoder.decode(record.data).trim();
          }
          if (!cardId) cardId = serialNumber;

          document.getElementById('status').innerHTML = `<span>🎉</span> Read Tag: <b>${cardId}</b>`;
          fetchCardData(cardId);
        });
      } catch (err) {
        document.getElementById('status').innerHTML = `<span>⚠️</span> ${err.message}`;
      }
    });

    function createBlobUrl(base64Data) {
      const byteString = atob(base64Data.split(',')[1]);
      const mimeString = base64Data.split(',')[0].split(':')[1].split(';')[0];
      const ab = new ArrayBuffer(byteString.length);
      const ia = new Uint8Array(ab);
      for (let i = 0; i < byteString.length; i++) {
        ia[i] = byteString.charCodeAt(i);
      }
      const blob = new Blob([ab], { type: mimeString });
      return URL.createObjectURL(blob);
    }

    function renderFolder(name, fileObj) {
      if (!fileObj || !fileObj.data) {
        return `
          <div class="folder-display-card">
            <div class="folder-title">${name}</div>
            <div class="no-file">No file uploaded</div>
          </div>
        `;
      }
      const blobUrl = createBlobUrl(fileObj.data);
      return `
        <div class="folder-display-card">
          <div class="folder-title">${name}</div>
          <div style="margin-top: 0.4rem;">
            <a href="${blobUrl}" target="_blank" class="action-btn">📄 View</a>
            <a href="${blobUrl}" download="${fileObj.name}" class="action-btn dl">⬇️ ${fileObj.name}</a>
          </div>
        </div>
      `;
    }

    async function fetchCardData(cardId) {
      const res = await fetch(`${API_URL}/clinic/scan/${cardId}`);
      const result = await res.json();

      if (result.success) {
        const p = result.patient;
        document.getElementById('display-box').style.display = 'block';
        document.getElementById('patient-name').innerText = p.name;
        document.getElementById('patient-dob').innerText = `DOB: ${p.dob}`;
        document.getElementById('patient-blood').innerText = `Blood: ${p.bloodType}`;

        document.getElementById('insurance').innerText = p.insurance && p.insurance.provider 
          ? `${p.insurance.provider} (Policy: ${p.insurance.policy})` 
          : "Self-Pay / None";

        const allergyBox = document.getElementById('allergies-box');
        allergyBox.innerHTML = '';
        if (p.allergies && p.allergies.length) {
          p.allergies.forEach(a => {
            allergyBox.innerHTML += `<span class="tag-danger">⚠️ ${a}</span>`;
          });
        } else {
          allergyBox.innerHTML = '<span style="color:#64748b; font-size:0.85rem;">None Reported</span>';
        }

        document.getElementById('conditions').innerText = p.conditions && p.conditions.length ? p.conditions.join(', ') : 'None';
        document.getElementById('emergency').innerText = p.emergencyContact || 'None on record';

        const docs = p.document || {};
        document.getElementById('folders-container').innerHTML = `
          ${renderFolder("📝 Doctor's Clinical Notes", docs.doctorNotes)}
          ${renderFolder("🩸 Laboratory & Blood Tests", docs.bloodTests)}
          ${renderFolder("🦴 Radiology / X-Ray", docs.xray)}
          ${renderFolder("🧠 CT Scans & MRI", docs.ctScans)}
          ${renderFolder("📡 Ultrasound Diagnostics", docs.ultrasound)}
          ${renderFolder("❤️ Cardiology & ECG", docs.cardiology)}
        `;
      } else {
        alert(result.error);
      }
    }

    async function linkCard() {
      const email = document.getElementById('link-email').value.trim();
      const cardId = document.getElementById('link-card-id').value.trim();

      const res = await fetch(`${API_URL}/clinic/link-card`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, cardId })
      });
      const data = await res.json();
      alert(data.message || data.error);
    }
  </script>
</body>
</html>
