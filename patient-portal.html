<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Online Intake Portal</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; background: #f8fafc; color: #0f172a; }
    .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-weight: bold; margin-bottom: 0.3rem; font-size: 0.85rem; color: #475569; }
    input, select { width: 100%; padding: 0.6rem; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.95rem; }
    button { width: 100%; background: #0284c7; color: white; padding: 0.8rem; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    
    /* Navigation Tabs */
    .tab-container { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .tab-btn { flex: 1; padding: 0.75rem; background: #e2e8f0; color: #475569; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.95rem; transition: 0.2s; }
    .tab-btn.active { background: #0284c7; color: white; }

    /* Folder Upload Section Styling */
    .folder-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .folder-card { border: 1px dashed #cbd5e1; background: #f1f5f9; padding: 1rem; border-radius: 6px; }
    .folder-title { font-weight: bold; margin-bottom: 0.5rem; font-size: 0.9rem; color: #1e293b; display: flex; align-items: center; gap: 0.4rem; }
    .folder-card input[type="file"] { background: white; font-size: 0.8rem; padding: 0.4rem; }
    .existing-file { font-size: 0.75rem; color: #16a34a; font-weight: bold; margin-top: 0.3rem; }
  </style>
</head>
<body>

  <!-- Auth Box with Register & Login Tabs -->
  <div class="card" id="auth-box">
    <div class="tab-container">
      <button class="tab-btn active" id="tab-reg-btn" onclick="showAuthTab('register')">Create New Account</button>
      <button class="tab-btn" id="tab-login-btn" onclick="showAuthTab('login')">Existing Patient Login</button>
    </div>

    <!-- Registration Form -->
    <form id="register-form">
      <h3 style="margin-top:0; color:#0284c7;">🏥 New Patient Registration</h3>
      <div class="form-group"><label>Email Address</label><input type="email" id="reg-email" placeholder="jane@example.com" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="reg-pass" required></div>
      <div class="form-group"><label>Full Name</label><input type="text" id="reg-name" placeholder="Jane Doe" required></div>
      <div class="form-group"><label>Date of Birth</label><input type="text" id="reg-dob" placeholder="May 14, 1992" required></div>
      <div class="form-group"><label>Blood Type</label>
        <select id="reg-blood"><option>O+</option><option>O-</option><option>A+</option><option>A-</option><option>B+</option><option>AB+</option></select>
      </div>
      <button type="submit">Register & Continue to Intake</button>
    </form>

    <!-- Login Form -->
    <form id="login-form" style="display:none;">
      <h3 style="margin-top:0; color:#0284c7;">🔑 Patient Login</h3>
      <div class="form-group"><label>Email Address</label><input type="email" id="login-email" placeholder="jane@example.com" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="login-pass" required></div>
      <button type="submit" style="background:#0284c7;">Log In to My Records</button>
    </form>
  </div>

  <!-- Medical Intake / Upload Dashboard -->
  <div class="card" id="intake-box" style="display:none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 style="margin-top:0; color:#0284c7;" id="welcome-heading">📝 Medical & Insurance Records</h2>
      <button onclick="location.reload()" style="width:auto; padding: 0.4rem 0.8rem; background:#64748b; font-size: 0.8rem;">Log Out</button>
    </div>
    
    <form id="intake-form">
      <div class="form-group"><label>Insurance Provider</label><input type="text" id="ins-provider" placeholder="e.g. Sagicor / Guardian Life"></div>
      <div class="form-group"><label>Policy Number</label><input type="text" id="ins-policy" placeholder="POL-882019"></div>
      <div class="form-group"><label>Severe Allergies (comma separated)</label><input type="text" id="allergies" placeholder="Penicillin, Peanuts"></div>
      <div class="form-group"><label>Chronic Conditions</label><input type="text" id="conditions" placeholder="Asthma, Diabetes"></div>
      <div class="form-group"><label>Emergency Contact</label><input type="text" id="emergency" placeholder="John Doe - 555-0192" required></div>
      
      <h3 style="margin-top: 1.5rem; margin-bottom: 0.3rem; color: #0284c7;">📁 Upload / Update Medical Documents</h3>
      <p style="font-size: 0.8rem; color: #64748b; margin-top: 0;">Upload new scans or PDFs below to save into each respective category.</p>

      <div class="folder-grid">
        <div class="folder-card">
          <div class="folder-title">📝 1. Doctor's Notes</div>
          <input type="file" id="file-doc-notes" accept="image/*,.pdf">
          <div id="status-doc-notes" class="existing-file"></div>
        </div>
        <div class="folder-card">
          <div class="folder-title">🩸 2. Blood Tests</div>
          <input type="file" id="file-blood-tests" accept="image/*,.pdf">
          <div id="status-blood-tests" class="existing-file"></div>
        </div>
        <div class="folder-card">
          <div class="folder-title">🦴 3. X-Ray</div>
          <input type="file" id="file-xray" accept="image/*,.pdf">
          <div id="status-xray" class="existing-file"></div>
        </div>
        <div class="folder-card">
          <div class="folder-title">🧠 4. CT Scans</div>
          <input type="file" id="file-ct-scans" accept="image/*,.pdf">
          <div id="status-ct-scans" class="existing-file"></div>
        </div>
        <div class="folder-card">
          <div class="folder-title">📡 5. Ultrasound</div>
          <input type="file" id="file-ultrasound" accept="image/*,.pdf">
          <div id="status-ultrasound" class="existing-file"></div>
        </div>
        <div class="folder-card">
          <div class="folder-title">❤️ 6. Cardiology</div>
          <input type="file" id="file-cardiology" accept="image/*,.pdf">
          <div id="status-cardiology" class="existing-file"></div>
        </div>
      </div>

      <button type="submit" style="background:#16a34a; margin-top: 1.5rem;">Save & Sync to Cloud</button>
    </form>
  </div>

  <script>
    const API_URL = "https://medical-nfc-backend.onrender.com/api";
    let currentUser = null;

    function showAuthTab(tab) {
      if (tab === 'register') {
        document.getElementById('register-form').style.display = 'block';
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('tab-reg-btn').classList.add('active');
        document.getElementById('tab-login-btn').classList.remove('active');
      } else {
        document.getElementById('register-form').style.display = 'none';
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('tab-reg-btn').classList.remove('active');
        document.getElementById('tab-login-btn').classList.add('active');
      }
    }

    function populateIntakeForm(user) {
      currentUser = user;
      document.getElementById('auth-box').style.display = 'none';
      document.getElementById('intake-box').style.display = 'block';
      document.getElementById('welcome-heading').innerText = `Welcome, ${user.name}`;

      if (user.insurance) {
        document.getElementById('ins-provider').value = user.insurance.provider || '';
        document.getElementById('ins-policy').value = user.insurance.policy || '';
      }
      if (user.allergies) document.getElementById('allergies').value = user.allergies.join(', ');
      if (user.conditions) document.getElementById('conditions').value = user.conditions.join(', ');
      if (user.emergencyContact) document.getElementById('emergency').value = user.emergencyContact;

      // Show existing uploaded filenames if available
      const docs = user.document || {};
      if (docs.doctorNotes) document.getElementById('status-doc-notes').innerText = `✓ On File: ${docs.doctorNotes.name}`;
      if (docs.bloodTests) document.getElementById('status-blood-tests').innerText = `✓ On File: ${docs.bloodTests.name}`;
      if (docs.xray) document.getElementById('status-xray').innerText = `✓ On File: ${docs.xray.name}`;
      if (docs.ctScans) document.getElementById('status-ct-scans').innerText = `✓ On File: ${docs.ctScans.name}`;
      if (docs.ultrasound) document.getElementById('status-ultrasound').innerText = `✓ On File: ${docs.ultrasound.name}`;
      if (docs.cardiology) document.getElementById('status-cardiology').innerText = `✓ On File: ${docs.cardiology.name}`;
    }

    // Handle Register
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        email: document.getElementById('reg-email').value,
        password: document.getElementById('reg-pass').value,
        name: document.getElementById('reg-name').value,
        dob: document.getElementById('reg-dob').value,
        bloodType: document.getElementById('reg-blood').value
      };

      const res = await fetch(`${API_URL}/patient/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.success) {
        populateIntakeForm(data.user);
      } else {
        alert(data.error);
      }
    });

    // Handle Login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        email: document.getElementById('login-email').value,
        password: document.getElementById('login-pass').value
      };

      const res = await fetch(`${API_URL}/patient/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.success) {
        populateIntakeForm(data.user);
      } else {
        alert(data.error);
      }
    });

    async function readFileAsBase64(fileInput) {
      if (fileInput.files.length === 0) return null;
      const file = fileInput.files[0];
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve({ name: file.name, data: reader.result });
      });
    }

    // Handle Intake & Document Save
    document.getElementById('intake-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const existingDocs = (currentUser && currentUser.document) || {};

      // Keep existing files if no new file is selected
      const documents = {
        doctorNotes: (await readFileAsBase64(document.getElementById('file-doc-notes'))) || existingDocs.doctorNotes || null,
        bloodTests: (await readFileAsBase64(document.getElementById('file-blood-tests'))) || existingDocs.bloodTests || null,
        xray: (await readFileAsBase64(document.getElementById('file-xray'))) || existingDocs.xray || null,
        ctScans: (await readFileAsBase64(document.getElementById('file-ct-scans'))) || existingDocs.ctScans || null,
        ultrasound: (await readFileAsBase64(document.getElementById('file-ultrasound'))) || existingDocs.ultrasound || null,
        cardiology: (await readFileAsBase64(document.getElementById('file-cardiology'))) || existingDocs.cardiology || null
      };

      const payload = {
        email: currentUser.email,
        insurance: {
          provider: document.getElementById('ins-provider').value,
          policy: document.getElementById('ins-policy').value
        },
        allergies: document.getElementById('allergies').value.split(',').map(a => a.trim()).filter(Boolean),
        conditions: document.getElementById('conditions').value.split(',').map(c => c.trim()).filter(Boolean),
        emergencyContact: document.getElementById('emergency').value,
        document: documents
      };

      const res = await fetch(`${API_URL}/patient/update-profile`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.success) {
        currentUser = data.user;
        populateIntakeForm(data.user);
        alert("Your medical records and documents have been synced to the cloud successfully!");
      } else {
        alert("Error saving record: " + (data.error || "Please try again."));
      }
    });
  </script>
</body>
</html>
